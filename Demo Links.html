<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo Pages — Seven Media Venture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f7;padding:48px 32px;color:#1d1d1f;min-height:100vh}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.meta{font-size:13px;color:#86868b;margin-bottom:28px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.label{font-size:13px;color:#86868b;white-space:nowrap}
btn,button{font-size:13px;padding:7px 14px;border-radius:980px;border:1px solid #d2d2d7;background:#fff;color:#1d1d1f;cursor:pointer;transition:all .15s;font-family:inherit}
button.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
button:hover:not(.active){background:#f0f0f5}
.search-input{font-size:13px;padding:7px 16px;border-radius:980px;border:1px solid #d2d2d7;background:#fff;color:#1d1d1f;outline:none;width:230px}
.search-input:focus{border-color:#86868b}
.date-range{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:8px 16px}
.date-range input[type=date]{border:none;background:transparent;font-size:13px;color:#1d1d1f;outline:none;cursor:pointer;font-family:inherit}
.date-range .sep{color:#c7c7cc;font-size:16px;margin:0 2px}
.clear-date{font-size:12px;color:#86868b;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px}
.clear-date:hover{background:#f0f0f5;color:#1d1d1f}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap}
.divider{width:100%;height:1px;background:#e8e8ed;margin:6px 0}
.count{font-size:13px;color:#86868b;margin-bottom:12px}
.grid{display:flex;flex-direction:column;gap:8px;max-width:760px}
a.card{display:flex;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:14px 20px;text-decoration:none;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:box-shadow .15s}
a.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card-left{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:12px;color:#5f7a96;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}
.url{font-size:12px;color:#86868b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-badge{font-size:11px;font-weight:500;color:#86868b;background:#f0f0f5;padding:4px 10px;border-radius:980px;white-space:nowrap;flex-shrink:0}
.arrow{font-size:18px;color:#c7c7cc;flex-shrink:0}
</style>
</head>
<body>
<h1>Demo Pages</h1>
<p class="meta">Last updated: June 18, 2026 at 22:37</p>

<div class="row">
  <span class="label">Sort:</span>
  <button id="btnName" class="active" onclick="setSort('name')">Name A–Z</button>
  <button id="btnNew" onclick="setSort('new')">Newest first</button>
  <button id="btnOld" onclick="setSort('old')">Oldest first</button>
  <input class="search-input" id="search" placeholder="🔍  Search company..." oninput="render()" />
</div>

<div class="row">
  <span class="label">Date range:</span>
  <div class="date-range">
    <input type="date" id="dateFrom" onchange="render()" />
    <span class="sep">→</span>
    <input type="date" id="dateTo" onchange="render()" />
    <button class="clear-date" onclick="clearDates()" title="Clear dates">✕</button>
  </div>
  <div class="quick-btns">
    <button onclick="setRange('thismonth')">This month</button>
    <button onclick="setRange('lastmonth')">Last month</button>
    <button onclick="setRange('thisyear')">This year</button>
    <button onclick="setRange('all')">All time</button>
  </div>
</div>

<p class="count" id="count"></p>
<div class="grid" id="grid"></div>

var order='name';

function setSort(o){
  order=o;
  document.querySelectorAll('.row button[id^=btn]').forEach(function(b){b.classList.remove('active')});
  document.getElementById('btn'+o.charAt(0).toUpperCase()+o.slice(1)).classList.add('active');
  render();
}

function pad(n){return n<10?'0'+n:n;}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function setRange(r){
  var now=new Date();
  var y=now.getFullYear(), m=now.getMonth();
  var from,to;
  if(r==='thismonth'){
    from=new Date(y,m,1); to=new Date(y,m+1,0);
  }else if(r==='lastmonth'){
    from=new Date(y,m-1,1); to=new Date(y,m,0);
  }else if(r==='thisyear'){
    from=new Date(y,0,1); to=new Date(y,11,31);
  }else{
    clearDates(); return;
  }
  document.getElementById('dateFrom').value=toISO(from);
  document.getElementById('dateTo').value=toISO(to);
  render();
}

function clearDates(){
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  render();
}

function fmt(d){
  if(!d) return '—';
  var p=d.split('-');
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[parseInt(p[1])-1]+' '+parseInt(p[2])+', '+p[0];
}

function render(){
  var q=(document.getElementById('search').value||'').toLowerCase();
  var from=document.getElementById('dateFrom').value;
  var to=document.getElementById('dateTo').value;
  var rows=data.filter(function(r){
    if(q&&!r.name.toLowerCase().includes(q)&&!r.slug.includes(q)&&!(r.desc||'').toLowerCase().includes(q)) return false;
    if(from&&r.date&&r.date<from) return false;
    if(to&&r.date&&r.date>to) return false;
    return true;
  });
  if(order==='name') rows.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(order==='new') rows.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  else rows.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  var total=data.length;
  document.getElementById('count').textContent=rows.length===total?total+' companies':rows.length+' of '+total+' companies';
  document.getElementById('grid').innerHTML=rows.map(function(r){
    var descHtml=r.desc?'<div class="desc">'+r.desc+'</div>':'';
    return '<a class="card" href="'+r.url+'" target="_blank">'
      +'<div class="card-left"><div class="name">'+r.name+'</div>'+descHtml+'<div class="url">'+r.url+'</div></div>'
      +'<span class="date-badge">'+fmt(r.date)+'</span>'
      +'<span class="arrow">›</span>'
      +'</a>';
  }).join('');
}
render();
</script>
</body>
